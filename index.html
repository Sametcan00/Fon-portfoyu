<style>
/* Düzen: tek sütunlu iOS uygulaması; renkli ışık lekeleri üzerinde buzlu cam yüzeyler, altta yüzen cam sekme çubuğu */
:root{
  --bg:#f2f2f7;--ink:#000;--mut:#6c6c70;--line:rgba(60,60,67,.14);--field:rgba(120,120,128,.12);
  --ac:#007aff;--acInk:#fff;--up:#248a3d;--dn:#ff3b30;--upBg:rgba(52,199,89,.15);--dnBg:rgba(255,59,48,.12);
  --glass:rgba(255,255,255,.5);--glass2:rgba(255,255,255,.78);--gbrd:rgba(255,255,255,.72);--ghi:rgba(255,255,255,.95);
  --gsh:0 12px 32px rgba(28,48,92,.10),0 1px 2px rgba(28,48,92,.06);--spec:rgba(255,255,255,.55);
  --b1:#b9d4ff;--b2:#c4f0e4;--b3:#ffe3cc;--scrim:rgba(0,0,0,.3);
  --f1:#3b82f6;--f2:#10b981;--f3:#f59e0b;--f4:#ec4899;--f5:#8b5cf6;--f6:#06b6d4;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,'Segoe UI',sans-serif;
  --disp:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--ink:#fff;--mut:#98989f;--line:rgba(84,84,88,.5);--field:rgba(120,120,128,.24);
  --ac:#0a84ff;--acInk:#fff;--up:#30d158;--dn:#ff453a;--upBg:rgba(48,209,88,.16);--dnBg:rgba(255,69,58,.16);
  --glass:rgba(30,36,52,.46);--glass2:rgba(44,50,68,.8);--gbrd:rgba(255,255,255,.10);--ghi:rgba(255,255,255,.16);
  --gsh:0 12px 32px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3);--spec:rgba(255,255,255,.10);
  --b1:#10285f;--b2:#0a3d38;--b3:#2f1a4a;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000;--ink:#fff;--mut:#98989f;--line:rgba(84,84,88,.5);--field:rgba(120,120,128,.24);
  --ac:#0a84ff;--acInk:#fff;--up:#30d158;--dn:#ff453a;--upBg:rgba(48,209,88,.16);--dnBg:rgba(255,69,58,.16);
  --glass:rgba(30,36,52,.46);--glass2:rgba(44,50,68,.8);--gbrd:rgba(255,255,255,.10);--ghi:rgba(255,255,255,.16);
  --gsh:0 12px 32px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3);--spec:rgba(255,255,255,.10);
  --b1:#10285f;--b2:#0a3d38;--b3:#2f1a4a;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{min-height:100%;margin:0;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:active{transform:scale(.97);transition:transform .08s}
[hidden]{display:none!important}
/* Sayfa geçişi: ileri sağdan, geri soldan kayar */
.pg-fwd{animation:pgf .32s cubic-bezier(.2,.9,.3,1)}.pg-back{animation:pgb .32s cubic-bezier(.2,.9,.3,1)}.pg-fade{animation:pgx .22s ease-out}
@keyframes pgf{from{transform:translateX(28px);opacity:0}}@keyframes pgb{from{transform:translateX(-28px);opacity:0}}@keyframes pgx{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.pg-fwd,.pg-back,.pg-fade{animation:none}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* Ambiyans: cam yüzeylerin arkasında kırılan renkli ışık */
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.85;animation:drift 26s ease-in-out infinite alternate}
.amb i:nth-child(1){width:70vmax;height:70vmax;left:-30vmax;top:-30vmax;background:var(--b1)}
.amb i:nth-child(2){width:55vmax;height:55vmax;right:-25vmax;top:10vh;background:var(--b2);animation-duration:32s}
.amb i:nth-child(3){width:50vmax;height:50vmax;left:10vw;bottom:-30vmax;background:var(--b3);animation-duration:38s}
@keyframes drift{to{transform:translate(4vmax,3vmax) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.amb i{animation:none}*{transition:none!important}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(104px + var(--sab));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
/* Cam yüzey */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gbrd);box-shadow:inset 0 1px 0 var(--ghi),var(--gsh)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(140deg,var(--spec),transparent 38%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass2)}}
.card{border-radius:24px}
/* Başlık */
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:6px 2px 0}
.hdr h1{font:700 34px/1.05 var(--disp);letter-spacing:-.025em;margin:2px 0 0}
.eyebrow{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#e0a21b}.dot.on{background:var(--up)}
.hbtns{display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;padding:0;color:var(--ink)}
.ib svg{width:20px;height:20px;position:relative}
/* Ana kart */
.hero{border-radius:28px;padding:20px 20px 16px;display:flex;flex-direction:column;gap:6px}
.lbl{font-size:13px;color:var(--mut)}
.big{font:700 42px/1.05 var(--disp);letter-spacing:-.03em;position:relative}
.big .cur{font-size:.55em;font-weight:600;margin-right:4px;color:var(--mut)}.big .dec{font-size:.55em;font-weight:600;color:var(--mut)}
.big.md{font-size:34px}
.chg{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-weight:600;position:relative}
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:99px;font-size:13px;font-weight:600}
.chip.up{background:var(--upBg);color:var(--up)}.chip.dn{background:var(--dnBg);color:var(--dn)}
.chg .per{color:var(--mut);font-weight:500;font-size:13px}
.ref{font-size:12px;color:var(--mut);position:relative}
.up{color:var(--up)}.dn{color:var(--dn)}
.seg{display:flex;padding:3px;border-radius:99px;background:var(--field);position:relative;margin-top:10px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:8px 10px;border-radius:99px;font-size:13px;font-weight:600;transition:background .25s,color .25s}
.seg button.on{background:var(--glass2);color:var(--ink);box-shadow:inset 0 1px 0 var(--ghi),0 2px 8px rgba(0,0,0,.08)}
/* Dağılım */
.alloc{border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.abar{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;position:relative}
.abar i{display:block;height:100%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);position:relative}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.sech{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px 0}
.sech h2{font:700 20px var(--disp);letter-spacing:-.01em;margin:0}.sech span{font-size:13px;color:var(--mut)}
/* Liste */
.list{border-radius:22px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:13px 16px;border:0;background:none;width:100%;text-align:left;color:inherit}
.row+.row::after{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line)}
button.row:active{background:var(--field)}
.row .l{flex:1;min-width:0}.r{text-align:right;flex-shrink:0}
.row b{font-weight:600}
.sub{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d{font-size:13px;font-weight:500}
.av{width:42px;height:42px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;font:700 12px var(--disp);letter-spacing:.02em;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 12px color-mix(in srgb,var(--c) 35%,transparent)}
.av.lg{width:56px;height:56px;border-radius:18px;font-size:15px}
.empty{padding:28px 16px;text-align:center;color:var(--mut);font-size:14px;position:relative}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--field);color:var(--mut)}
/* Detay */
.dnav{display:flex;justify-content:space-between;padding-top:4px}
.cap{border-radius:99px;padding:9px 15px;font-size:14px;font-weight:600;border:1px solid var(--gbrd);color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.cap svg{width:16px;height:16px;position:relative}
.cap span{position:relative}
.dhead{display:flex;flex-direction:column;gap:4px;padding:4px 4px 0}
.dhead h2{font:700 22px/1.2 var(--disp);letter-spacing:-.015em;margin:6px 0 2px;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-radius:22px;overflow:hidden}
.stats>div{padding:14px;min-width:0;position:relative}.stats>div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--gbrd);border-radius:16px;padding:12px 16px;min-height:48px;font-weight:600;font-size:15px;color:var(--ink)}
.btn span{position:relative}
.btn.pri{background:var(--ac);border-color:transparent;color:var(--acInk);box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.red{background:var(--dn);border-color:transparent;color:#fff}
.btn.plain{background:var(--field);border-color:transparent}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:99px}
.rowbtn{border:0;background:var(--field);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ac)}
.rowbtn.del{color:var(--dn)}
/* Ayarlar / özet */
.grp{display:flex;flex-direction:column;gap:6px}
.grp>.gl{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);padding:0 6px}
.pad{padding:16px;position:relative;display:flex;flex-direction:column;gap:10px}
.pbar{height:6px;border-radius:9px;background:var(--field);overflow:hidden}.pbar i{display:block;height:100%;background:var(--c)}
/* Sekme çubuğu */
.tabbar{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sab));display:flex;gap:2px;padding:5px;border-radius:99px;background:var(--glass2)}
.tabbar button{position:relative;border:0;background:none;border-radius:99px;padding:7px 18px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);min-width:76px;transition:background .25s,color .25s}
.tabbar svg{width:22px;height:22px}
.tabbar button.on{color:var(--ac);background:var(--field)}
/* Sayfa (bottom sheet) */
#m{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-end;justify-content:center;z-index:20;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}#m.open{display:flex}
.sheet{width:100%;max-width:520px;border-radius:30px 30px 0 0;padding:10px 18px calc(22px + var(--sab));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));max-height:90vh;overflow:auto;background:var(--glass2);animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet>*{position:relative}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(min-width:600px){#m{align-items:center}.sheet{border-radius:30px}}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px;filter:contrast(3)}
.sheet h3{margin:0 0 14px;font:700 19px var(--disp);letter-spacing:-.01em}
.sheet p{margin:0 0 10px}
.f{margin-bottom:12px}.f .lh{font-size:13px;color:var(--mut);margin-bottom:5px;display:flex;justify-content:space-between}
.f input,.f textarea,.inp{width:100%;border:1px solid var(--line);background:var(--field);border-radius:14px;padding:11px 13px;font-size:16px}
.f input[readonly]{opacity:.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two>*{min-width:0}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 12px}
.lnk{border:0;background:none;color:var(--ac);font-size:13px;font-weight:600;padding:0}
.btns{display:flex;gap:10px;margin-top:14px}.btns .btn{flex:1}
.pv{background:var(--field);border-radius:16px;padding:12px 14px;font-size:14px;margin-top:4px}
.pv div{display:flex;justify-content:space-between;padding:3px 0}.pv .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700}
.err{color:var(--dn);font-size:13px;min-height:18px;margin:8px 0 0}
#t{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;max-width:90vw;background:var(--glass2)}
.warn{border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:13px}.warn>*{position:relative}.warn .l{flex:1}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidefile{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%);pointer-events:none}
/* ===== Hareket sistemi: iOS yay eğrisi, sayfa/sekme geçişleri, paneller, sayılar ===== */
:root{--spring:cubic-bezier(.32,.72,0,1)}
button{transition:transform .35s var(--spring),background-color .2s,color .2s}
button:active{transform:scale(.96);transition:transform .08s}
button.row:active{transform:scale(.985)}
@keyframes vt-push-in{from{transform:translateX(38%);opacity:0}}
@keyframes vt-push-out{to{transform:translateX(-22%);opacity:0}}
@keyframes vt-pop-in{from{transform:translateX(-22%);opacity:0}}
@keyframes vt-pop-out{to{transform:translateX(38%);opacity:0}}
@keyframes vt-out-l{to{opacity:0;transform:translateX(-16px) scale(.985)}}
@keyframes vt-out-r{to{opacity:0;transform:translateX(16px) scale(.985)}}
@keyframes vt-in-r{from{opacity:0;transform:translateX(22px) scale(.985)}}
@keyframes vt-in-l{from{opacity:0;transform:translateX(-22px) scale(.985)}}
html.vt-theme::view-transition-old(root){animation:none}
html.vt-theme::view-transition-new(root){animation:.62s cubic-bezier(.4,0,.2,1) both vt-reveal;mix-blend-mode:normal}
@keyframes vt-reveal{from{clip-path:circle(0 at var(--vx,50%) var(--vy,50%))}to{clip-path:circle(150vmax at var(--vx,50%) var(--vy,50%))}}
/* Kayan seçim vurgusu (segment ve alt menü) */
.seg>.thumb,.tabbar>.thumb{position:absolute;left:0;top:3px;bottom:3px;width:0;border-radius:99px;pointer-events:none;background:var(--glass2);box-shadow:inset 0 1px 0 var(--ghi),0 2px 10px rgba(0,0,0,.10);transition:transform .45s var(--spring),width .45s var(--spring)}
.tabbar>.thumb{top:5px;bottom:5px;background:var(--field);box-shadow:none}
.seg button,.tabbar button{position:relative;z-index:1}
.seg button.on{background:none;box-shadow:none}.tabbar button.on{background:none}
.tabbar button svg{transition:transform .45s var(--spring)}.tabbar button.on svg{transform:translateY(-1px) scale(1.08)}
/* Alt paneller: yaylı açılış, kapanış, aşağı çekerek kapatma */
#m.open{animation:fadeIn .25s ease-out}
#m.closing,#m.fading{animation:fadeOut .28s ease-in forwards}
.sheet{animation:sheetUp .5s var(--spring);overscroll-behavior:contain}
#m.closing .sheet{animation:sheetDown .28s cubic-bezier(.4,0,1,1) forwards}
.sheet.noanim,.scrim.noanim{animation:none}.sheet.swap>*{animation:fadeIn .22s ease-out}
.sheet.drag{animation:none;transition:none}.sheet.snap{animation:none;transition:transform .36s var(--spring)}
@keyframes sheetUp{from{transform:translateY(100%)}}@keyframes sheetDown{to{transform:translateY(105%)}}
@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}
@media(min-width:600px){.sheet{animation:sheetPop .4s var(--spring)}#m.closing .sheet{animation:sheetFade .22s ease-in forwards}}
@keyframes sheetPop{from{transform:scale(.94);opacity:0}}@keyframes sheetFade{to{transform:scale(.96);opacity:0}}
/* Bildirim */
#t{opacity:0;transform:translate(-50%,-16px) scale(.95);pointer-events:none;transition:opacity .25s ease,transform .5s var(--spring)}
#t.show{opacity:1;transform:translate(-50%,0) scale(1)}
/* Sayfaya giriş: bölümler ve satırlar sırayla belirir */
.enter>*{animation:riseIn .52s var(--spring) both;animation-delay:calc(min(var(--i,0),8) * 38ms)}
.enter .list>.row{animation:riseIn .52s var(--spring) both;animation-delay:calc(min(var(--i,0),10) * 30ms + 110ms)}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}}
.row-new{animation:rowNew .6s var(--spring) both}
@keyframes rowNew{from{opacity:0;transform:scale(.95)}}
.tb-fwd{animation:vt-in-r .42s var(--spring) both}.tb-bwd{animation:vt-in-l .42s var(--spring) both}
.abar i,.pbar i{transition:width .8s var(--spring)}
.chip{transition:background-color .3s,color .3s}
.glass,.btn,.cap,.ib{transition:background-color .35s,border-color .35s,box-shadow .35s,transform .35s var(--spring)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
/* ===== 1.2.0 düzeltmeleri ===== */
:root{--sab:env(safe-area-inset-bottom,0px)}
/* Cam yüzeyler: bulanıklık her durumda yuvarlak köşeden kırpılır (Safari'de köşeli kutu görünmesin) */
.glass{border-radius:var(--r,22px);clip-path:inset(0 round var(--r,22px));box-shadow:inset 0 1px 0 var(--ghi)}
.hero{--r:28px}.card{--r:24px}.list,.stats,.alloc{--r:22px}.warn{--r:18px}.ib{--r:50%}.cap,.tabbar,#t{--r:99px}.btn{--r:16px}
.sheet{border-radius:30px 30px 0 0;clip-path:inset(0 round 30px 30px 0 0);overflow-x:hidden}
@media(min-width:600px){.sheet{border-radius:30px;clip-path:inset(0 round 30px)}}
/* Alt menü ve bildirim: transform ile ortalama yok */
.tabbar{left:0;right:0;margin:0 auto;width:max-content;transform:none}
#t{left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100vw - 32px);transform:translateY(-16px) scale(.95)}
#t.show{transform:none}
/* Arka plan alt kenarda düz zemin rengine bağlanır: iOS'un çizilemeyen alt şeridiyle dikiş görünmez */
.amb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34vh;background:linear-gradient(to bottom,transparent,var(--bg) 92%)}
/* Sayfa geçişleri canlı ekranda yapılır (cam bulanıklığı geçiş boyunca korunur) */
#app.leaving{transform:translateX(var(--exd,0));transition:transform .15s cubic-bezier(.4,0,1,1)}

function norm(o){
  if(!o||!Array.isArray(o.funds))return null;let k=0;const nid=()=>Date.now()+(k++);
  const lots=a=>(Array.isArray(a)?a:[]).filter(l=>l&&+l.qty>0).map(l=>({id:l.id??nid(),date:isDate(l.date)?l.date:today(),qty:+l.qty,cost:+l.cost||0}));
  const funds=o.funds.filter(f=>f&&f.code).map(f=>{const price=+f.price>0?+f.price:0;return{
    code:String(f.code).toUpperCase(),name:String(f.name||f.code),type:String(f.type||'Yatırım Fonu'),price,
    tax:typeof f.tax==='number'&&f.tax>=0&&f.tax<1&&(f.tax>0||f.taxSet)?f.tax:defTax(f.type),taxSet:!!f.taxSet,lots:lots(f.lots),
    hist:(Array.isArray(f.hist)?f.hist:[]).filter(Boolean).map(h=>({id:h.id??nid(),type:h.type||'',date:isDate(h.date)?h.date:today(),detail:String(h.detail||''),amount:+h.amount||0,gain:+h.gain||0,prev:Array.isArray(h.prev)?lots(h.prev):null,undone:!!h.undone})),
    log:sortLog((Array.isArray(f.log)?f.log:[]).filter(e=>e&&isDate(e.d)&&+e.p>0).map(e=>({d:e.d,p:+e.p})))}});
  // Güncel fiyat her zaman fiyat geçmişinin son kaydıdır
  funds.forEach(f=>{const L=f.log,last=L[L.length-1];if(f.price&&(!last||Math.abs(last.p-f.price)>1e-12))f.log=sortLog([...L.filter(e=>e.d!==today()),{d:today(),p:f.price}])});
  return{funds,updatedAt:+o.updatedAt||0}}
const addD=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*864e5).toISOString().slice(0,10);
// Fiyat geçmişi: tarihe göre sıralı, her güne tek kayıt, bir önceki kayıtla aynı olan fiyat (hafta sonu/tatil tekrarı) atılır
function sortLog(a){const m=new Map();a.forEach(e=>m.set(e.d,e.p));const s=[...m].sort((x,y)=>x[0]<y[0]?-1:x[0]>y[0]?1:0).map(([d,p])=>({d,p}));const o=[];for(const e of s)if(!o.length||Math.abs(o[o.length-1].p-e.p)>1e-12)o.push(e);return o.slice(-400)}

function chg(f,per){const r=refOf(f,per);let v=0,b=0;if(r)for(const l of f.lots){const base=r.d&&l.date<=r.d?r.p:(r.d||l.date>=r.to)?l.cost:f.price;b+=l.qty*base;v+=l.qty*(f.price-base)}return{v,b,p:b>0?v/b*100:0,r}}

    const r=fifo(sorted(f),q,p,f.tax);let rem=q;const nl=[];for(const l of sorted(f)){if(rem<=0){nl.push(l);continue}const t=Math.min(l.qty,rem);rem-=t;const left=+(l.qty-t).toFixed(6);if(left>1e-6)nl.push({...l,qty:left})}

(()=>{const nav=document.getElementById('nav');let d=null,blockClick=false;

    const r=nav.getBoundingClientRect(),w=b[0].offsetWidth,lo=b[0].offsetLeft,hi=b[b.length-1].offsetLeft;

    let best=b[0],bd=1e9;b.forEach(k=>{const dd=Math.abs(k.offsetLeft+k.offsetWidth/2-(x+w/2));if(dd<bd){bd=dd;best=k}});
    d.t=best.dataset.id;b.forEach(k=>k.classList.toggle('pre',k===best))});
  const end=(e,cancel)=>{if(!d||e.pointerId!==d.id)return;const m=d.moved,t=d.t,x=d.x,w=d.w;d=null;if(!m)return;
    blockClick=true;setTimeout(()=>blockClick=false,350);nav.classList.remove('drag');

  nav.addEventListener('pointerup',e=>end(e,false));nav.addEventListener('pointercancel',e=>end(e,true));
  nav.addEventListener('click',e=>{if(blockClick){e.stopPropagation();e.preventDefault()}},true);
})();
/* Ana ekran uygulaması: sekme çubuğunu her sayfada aynı yükseklikte tut */
function placeNav(){const st=navigator.standalone||matchMedia('(display-mode: standalone)').matches;root.classList.toggle('pwa',!!st);if(!st)return;
  const land=innerWidth>innerHeight,H=land?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);
  root.style.setProperty('--scrH',H+'px');const n=document.getElementById('nav');if(n&&n.offsetHeight)root.style.setProperty('--tbH',n.offsetHeight+'px')}
placeNav();addEventListener('resize',placeNav);addEventListener('orientationchange',()=>setTimeout(placeNav,300));addEventListener('pageshow',placeNav);
</script>
