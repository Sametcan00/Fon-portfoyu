<style>
/* Düzen: tek sütunlu iOS uygulaması; renkli ışık lekeleri üzerinde buzlu cam yüzeyler, altta yüzen cam sekme çubuğu */
:root{
  --bg:#f2f2f7;--ink:#000;--mut:#6c6c70;--line:rgba(60,60,67,.14);--field:rgba(120,120,128,.12);
  --ac:#007aff;--acInk:#fff;--up:#248a3d;--dn:#ff3b30;--upBg:rgba(52,199,89,.15);--dnBg:rgba(255,59,48,.12);
  --glass:rgba(255,255,255,.5);--glass2:rgba(255,255,255,.78);--gbrd:rgba(255,255,255,.72);--ghi:rgba(255,255,255,.95);
  --gsh:0 12px 32px rgba(28,48,92,.10),0 1px 2px rgba(28,48,92,.06);--spec:rgba(255,255,255,.55);
  --b1:#b9d4ff;--b2:#c4f0e4;--b3:#ffe3cc;--scrim:rgba(0,0,0,.3);
  --f1:#3b82f6;--f2:#10b981;--f3:#f59e0b;--f4:#ec4899;--f5:#8b5cf6;--f6:#06b6d4;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,'Segoe UI',sans-serif;
  --disp:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--ink:#fff;--mut:#98989f;--line:rgba(84,84,88,.5);--field:rgba(120,120,128,.24);
  --ac:#0a84ff;--acInk:#fff;--up:#30d158;--dn:#ff453a;--upBg:rgba(48,209,88,.16);--dnBg:rgba(255,69,58,.16);
  --glass:rgba(30,36,52,.46);--glass2:rgba(44,50,68,.8);--gbrd:rgba(255,255,255,.10);--ghi:rgba(255,255,255,.16);
  --gsh:0 12px 32px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3);--spec:rgba(255,255,255,.10);
  --b1:#10285f;--b2:#0a3d38;--b3:#2f1a4a;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000;--ink:#fff;--mut:#98989f;--line:rgba(84,84,88,.5);--field:rgba(120,120,128,.24);
  --ac:#0a84ff;--acInk:#fff;--up:#30d158;--dn:#ff453a;--upBg:rgba(48,209,88,.16);--dnBg:rgba(255,69,58,.16);
  --glass:rgba(30,36,52,.46);--glass2:rgba(44,50,68,.8);--gbrd:rgba(255,255,255,.10);--ghi:rgba(255,255,255,.16);
  --gsh:0 12px 32px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3);--spec:rgba(255,255,255,.10);
  --b1:#10285f;--b2:#0a3d38;--b3:#2f1a4a;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{min-height:100%;margin:0;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:active{transform:scale(.97);transition:transform .08s}
[hidden]{display:none!important}
/* Sayfa geçişi: ileri sağdan, geri soldan kayar */
.pg-fwd{animation:pgf .32s cubic-bezier(.2,.9,.3,1)}.pg-back{animation:pgb .32s cubic-bezier(.2,.9,.3,1)}.pg-fade{animation:pgx .22s ease-out}
@keyframes pgf{from{transform:translateX(28px);opacity:0}}@keyframes pgb{from{transform:translateX(-28px);opacity:0}}@keyframes pgx{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.pg-fwd,.pg-back,.pg-fade{animation:none}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* Ambiyans: cam yüzeylerin arkasında kırılan renkli ışık */
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.85;animation:drift 26s ease-in-out infinite alternate}
.amb i:nth-child(1){width:70vmax;height:70vmax;left:-30vmax;top:-30vmax;background:var(--b1)}
.amb i:nth-child(2){width:55vmax;height:55vmax;right:-25vmax;top:10vh;background:var(--b2);animation-duration:32s}
.amb i:nth-child(3){width:50vmax;height:50vmax;left:10vw;bottom:-30vmax;background:var(--b3);animation-duration:38s}
@keyframes drift{to{transform:translate(4vmax,3vmax) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.amb i{animation:none}*{transition:none!important}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(104px + var(--sab));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
/* Cam yüzey */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gbrd);box-shadow:inset 0 1px 0 var(--ghi),var(--gsh)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(140deg,var(--spec),transparent 38%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass2)}}
.card{border-radius:24px}
/* Başlık */
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:6px 2px 0}
.hdr h1{font:700 34px/1.05 var(--disp);letter-spacing:-.025em;margin:2px 0 0}
.eyebrow{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#e0a21b}.dot.on{background:var(--up)}
.hbtns{display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;padding:0;color:var(--ink)}
.ib svg{width:20px;height:20px;position:relative}
/* Ana kart */
.hero{border-radius:28px;padding:20px 20px 16px;display:flex;flex-direction:column;gap:6px}
.lbl{font-size:13px;color:var(--mut)}
.big{font:700 42px/1.05 var(--disp);letter-spacing:-.03em;position:relative}
.big .cur{font-size:.55em;font-weight:600;margin-right:4px;color:var(--mut)}.big .dec{font-size:.55em;font-weight:600;color:var(--mut)}
.big.md{font-size:34px}
.chg{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-weight:600;position:relative}
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:99px;font-size:13px;font-weight:600}
.chip.up{background:var(--upBg);color:var(--up)}.chip.dn{background:var(--dnBg);color:var(--dn)}
.chg .per{color:var(--mut);font-weight:500;font-size:13px}
.ref{font-size:12px;color:var(--mut);position:relative}
.up{color:var(--up)}.dn{color:var(--dn)}
.seg{display:flex;padding:3px;border-radius:99px;background:var(--field);position:relative;margin-top:10px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:8px 10px;border-radius:99px;font-size:13px;font-weight:600;transition:background .25s,color .25s}
.seg button.on{background:var(--glass2);color:var(--ink);box-shadow:inset 0 1px 0 var(--ghi),0 2px 8px rgba(0,0,0,.08)}
/* Dağılım */
.alloc{border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.abar{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;position:relative}
.abar i{display:block;height:100%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);position:relative}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.sech{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px 0}
.sech h2{font:700 20px var(--disp);letter-spacing:-.01em;margin:0}.sech span{font-size:13px;color:var(--mut)}
/* Liste */
.list{border-radius:22px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:13px 16px;border:0;background:none;width:100%;text-align:left;color:inherit}
.row+.row::after{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line)}
button.row:active{background:var(--field)}
.row .l{flex:1;min-width:0}.r{text-align:right;flex-shrink:0}
.row b{font-weight:600}
.sub{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d{font-size:13px;font-weight:500}
.av{width:42px;height:42px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;font:700 12px var(--disp);letter-spacing:.02em;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 12px color-mix(in srgb,var(--c) 35%,transparent)}
.av.lg{width:56px;height:56px;border-radius:18px;font-size:15px}
.empty{padding:28px 16px;text-align:center;color:var(--mut);font-size:14px;position:relative}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--field);color:var(--mut)}
/* Detay */
.dnav{display:flex;justify-content:space-between;padding-top:4px}
.cap{border-radius:99px;padding:9px 15px;font-size:14px;font-weight:600;border:1px solid var(--gbrd);color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.cap svg{width:16px;height:16px;position:relative}
.cap span{position:relative}
.dhead{display:flex;flex-direction:column;gap:4px;padding:4px 4px 0}
.dhead h2{font:700 22px/1.2 var(--disp);letter-spacing:-.015em;margin:6px 0 2px;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-radius:22px;overflow:hidden}
.stats>div{padding:14px;min-width:0;position:relative}.stats>div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--gbrd);border-radius:16px;padding:12px 16px;min-height:48px;font-weight:600;font-size:15px;color:var(--ink)}
.btn span{position:relative}
.btn.pri{background:var(--ac);border-color:transparent;color:var(--acInk);box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.red{background:var(--dn);border-color:transparent;color:#fff}
.btn.plain{background:var(--field);border-color:transparent}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:99px}
.rowbtn{border:0;background:var(--field);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ac)}
.rowbtn.del{color:var(--dn)}
/* Ayarlar / özet */
.grp{display:flex;flex-direction:column;gap:6px}
.grp>.gl{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);padding:0 6px}
.pad{padding:16px;position:relative;display:flex;flex-direction:column;gap:10px}
.pbar{height:6px;border-radius:9px;background:var(--field);overflow:hidden}.pbar i{display:block;height:100%;background:var(--c)}
/* Sekme çubuğu */
.tabbar{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sab));display:flex;gap:2px;padding:5px;border-radius:99px;background:var(--glass2)}
.tabbar button{position:relative;border:0;background:none;border-radius:99px;padding:7px 18px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);min-width:76px;transition:background .25s,color .25s}
.tabbar svg{width:22px;height:22px}
.tabbar button.on{color:var(--ac);background:var(--field)}
/* Sayfa (bottom sheet) */
#m{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-end;justify-content:center;z-index:20;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}#m.open{display:flex}
.sheet{width:100%;max-width:520px;border-radius:30px 30px 0 0;padding:10px 18px calc(22px + var(--sab));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));max-height:90vh;overflow:auto;background:var(--glass2);animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet>*{position:relative}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(min-width:600px){#m{align-items:center}.sheet{border-radius:30px}}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px;filter:contrast(3)}
.sheet h3{margin:0 0 14px;font:700 19px var(--disp);letter-spacing:-.01em}
.sheet p{margin:0 0 10px}
.f{margin-bottom:12px}.f .lh{font-size:13px;color:var(--mut);margin-bottom:5px;display:flex;justify-content:space-between}
.f input,.f textarea,.inp{width:100%;border:1px solid var(--line);background:var(--field);border-radius:14px;padding:11px 13px;font-size:16px}
.f input[readonly]{opacity:.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two>*{min-width:0}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 12px}
.lnk{border:0;background:none;color:var(--ac);font-size:13px;font-weight:600;padding:0}
.btns{display:flex;gap:10px;margin-top:14px}.btns .btn{flex:1}
.pv{background:var(--field);border-radius:16px;padding:12px 14px;font-size:14px;margin-top:4px}
.pv div{display:flex;justify-content:space-between;padding:3px 0}.pv .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700}
.err{color:var(--dn);font-size:13px;min-height:18px;margin:8px 0 0}
#t{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;max-width:90vw;background:var(--glass2)}
.warn{border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:13px}.warn>*{position:relative}.warn .l{flex:1}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidefile{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%);pointer-events:none}
/* ===== Hareket sistemi: iOS yay eğrisi, sayfa/sekme geçişleri, paneller, sayılar ===== */
:root{--spring:cubic-bezier(.32,.72,0,1)}
button{transition:transform .35s var(--spring),background-color .2s,color .2s}
button:active{transform:scale(.96);transition:transform .08s}
button.row:active{transform:scale(.985)}
@keyframes vt-push-in{from{transform:translateX(38%);opacity:0}}
@keyframes vt-push-out{to{transform:translateX(-22%);opacity:0}}
@keyframes vt-pop-in{from{transform:translateX(-22%);opacity:0}}
@keyframes vt-pop-out{to{transform:translateX(38%);opacity:0}}
@keyframes vt-out-l{to{opacity:0;transform:translateX(-16px) scale(.985)}}
@keyframes vt-out-r{to{opacity:0;transform:translateX(16px) scale(.985)}}
@keyframes vt-in-r{from{opacity:0;transform:translateX(22px) scale(.985)}}
@keyframes vt-in-l{from{opacity:0;transform:translateX(-22px) scale(.985)}}
html.vt-theme::view-transition-old(root){animation:none}
html.vt-theme::view-transition-new(root){animation:.62s cubic-bezier(.4,0,.2,1) both vt-reveal;mix-blend-mode:normal}
@keyframes vt-reveal{from{clip-path:circle(0 at var(--vx,50%) var(--vy,50%))}to{clip-path:circle(150vmax at var(--vx,50%) var(--vy,50%))}}
/* Kayan seçim vurgusu (segment ve alt menü) */
.seg>.thumb,.tabbar>.thumb{position:absolute;left:0;top:3px;bottom:3px;width:0;border-radius:99px;pointer-events:none;background:var(--glass2);box-shadow:inset 0 1px 0 var(--ghi),0 2px 10px rgba(0,0,0,.10);transition:transform .45s var(--spring),width .45s var(--spring)}
.tabbar>.thumb{top:5px;bottom:5px;background:var(--field);box-shadow:none}
.seg button,.tabbar button{position:relative;z-index:1}
.seg button.on{background:none;box-shadow:none}.tabbar button.on{background:none}
.tabbar button svg{transition:transform .45s var(--spring)}.tabbar button.on svg{transform:translateY(-1px) scale(1.08)}
/* Alt paneller: yaylı açılış, kapanış, aşağı çekerek kapatma */
#m.open{animation:fadeIn .25s ease-out}
#m.closing,#m.fading{animation:fadeOut .28s ease-in forwards}
#m.closing,#m.fading,#m.closing *,#m.fading *{pointer-events:none!important}
.sheet{animation:sheetUp .5s var(--spring);overscroll-behavior:contain}
#m.closing .sheet{animation:sheetDown .28s cubic-bezier(.4,0,1,1) forwards}
.sheet.noanim,.scrim.noanim{animation:none}.sheet.swap>*{animation:fadeIn .22s ease-out}
.sheet.drag{animation:none;transition:none}.sheet.snap{animation:none;transition:transform .36s var(--spring)}
@keyframes sheetUp{from{transform:translateY(100%)}}@keyframes sheetDown{to{transform:translateY(105%)}}
@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}
@media(min-width:600px){.sheet{animation:sheetPop .4s var(--spring)}#m.closing .sheet{animation:sheetFade .22s ease-in forwards}}
@keyframes sheetPop{from{transform:scale(.94);opacity:0}}@keyframes sheetFade{to{transform:scale(.96);opacity:0}}
/* Bildirim */
#t{opacity:0;transform:translate(-50%,-16px) scale(.95);pointer-events:none;transition:opacity .25s ease,transform .5s var(--spring)}
#t.show{opacity:1;transform:translate(-50%,0) scale(1)}
/* Sayfaya giriş: bölümler ve satırlar sırayla belirir */
.enter>*{animation:riseIn .52s var(--spring) both;animation-delay:calc(min(var(--i,0),8) * 38ms)}
.enter .list>.row{animation:riseIn .52s var(--spring) both;animation-delay:calc(min(var(--i,0),10) * 30ms + 110ms)}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}}
.row-new{animation:rowNew .6s var(--spring) both}
@keyframes rowNew{from{opacity:0;transform:scale(.95)}}
.tb-fwd{animation:vt-in-r .42s var(--spring) both}.tb-bwd{animation:vt-in-l .42s var(--spring) both}
.abar i,.pbar i{transition:width .8s var(--spring)}
.chip{transition:background-color .3s,color .3s}
.glass,.btn,.cap,.ib{transition:background-color .35s,border-color .35s,box-shadow .35s,transform .35s var(--spring)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
/* ===== 1.2.0 düzeltmeleri ===== */
:root{--sab:env(safe-area-inset-bottom,0px)}
/* Cam yüzeyler: bulanıklık her durumda yuvarlak köşeden kırpılır (Safari'de köşeli kutu görünmesin) */
.glass{border-radius:var(--r,22px);clip-path:inset(0 round var(--r,22px));box-shadow:inset 0 1px 0 var(--ghi)}
.hero{--r:28px}.card{--r:24px}.list,.stats,.alloc{--r:22px}.warn{--r:18px}.ib{--r:50%}.cap,.tabbar,#t{--r:99px}.btn{--r:16px}
.sheet{border-radius:30px 30px 0 0;clip-path:inset(0 round 30px 30px 0 0);overflow-x:hidden}
@media(min-width:600px){.sheet{border-radius:30px;clip-path:inset(0 round 30px)}}
/* Alt menü ve bildirim: transform ile ortalama yok */
.tabbar{left:0;right:0;margin:0 auto;width:max-content;transform:none}
#t{left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100vw - 32px);transform:translateY(-16px) scale(.95)}
#t.show{transform:none}
/* Arka plan alt kenarda düz zemin rengine bağlanır: iOS'un çizilemeyen alt şeridiyle dikiş görünmez */
.amb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34vh;background:linear-gradient(to bottom,transparent,var(--bg) 92%)}
/* Sayfa geçişleri canlı ekranda yapılır (cam bulanıklığı geçiş boyunca korunur) */
#app.leaving{transform:translateX(var(--exd,0));transition:transform .15s cubic-bezier(.4,0,1,1)}
#app.leaving>*:not(.grp,.hdr,.dnav,.acts),#app.leaving :is(.grp,.dnav,.acts)>*,#app.leaving .hdr>div:first-child,#app.leaving .hbtns>*{opacity:0;transition:opacity .13s ease-in}

const pnM=v=>{const s=String(v??'').trim();return /^\d{1,3}(\.\d{3})+$/.test(s)?trN(s):pn(s)};
function pn(v){const s=String(v??'').trim();if(!s)return NaN;if(s.includes('.')&&s.includes(','))return s.lastIndexOf(',')>s.lastIndexOf('.')?parseFloat(s.replace(/\./g,'').replace(',','.')):parseFloat(s.replace(/,/g,''));return parseFloat(s.replace(',','.'))}

// Yüklenen her veriyi (yerel, bulut, yedek) aynı şemaya getirir; bozuk kayıt uygulamayı kilitlemez
function norm(o){
  if(!o||!Array.isArray(o.funds))return null;let k=0;const nid=()=>Date.now()+(k++);
  const lots=a=>(Array.isArray(a)?a:[]).filter(l=>l&&+l.qty>0).map(l=>({id:l.id??nid(),date:isDate(l.date)?l.date:today(),qty:+l.qty,cost:+l.cost||0}));
  // 1.9: işlem kayıtlarında yapısal alanlar (adet q, fiyat p, sepet lot, satışta kullanılan sepetler used, stopaj tax, brüt rev; düzenleme kaydında ref/old) korunur

    log:sortLog((Array.isArray(f.log)?f.log:[]).filter(e=>e&&isDate(e.d)&&+e.p>0).map(e=>({d:e.d,p:+e.p}))),

  return r?{d:r.d,p:r.p,to:last.d,partial}:{d:null,p:0,to:last.d,partial}}
let S={funds:[mk('DCB','Deniz Portföy Para Piyasası Fonu','Para Piyasası',1.774494)],updatedAt:0},view={page:'home',code:null,tab:'lots',period:'total',rng:'1A',hm:'daily',txf:'all',txt:'all',yr:null},pend=null,lastPage=null;

/* --- İşlem kayıtları: eski (yalnız metin) ve yeni (yapısal) kayıtlar aynı biçimde okunur --- */
function buyInfo(h){let q=+h.q||0,p=+h.p||0;if(!(q>0&&p>0)){const m=/([\d.,]+)\s*adet\s*×\s*([\d.,]+)\s*₺/.exec(h.detail||'');if(m){q=trN(m[1]);p=trN(m[2])}}
  if(!(q>0&&p>0)){q=0;p=0}return{q,p,amt:+h.amount||0}}
function sellInfo(h){let q=+h.q||0,p=+h.p||0,tax=h.tax;
  if(!(q>0&&p>0)){const m=/([\d.,]+)\s*adet\s*×\s*([\d.,]+)\s*₺/.exec(h.detail||'');if(m){q=trN(m[1]);p=trN(m[2])}if(!(q>0&&p>0)){q=0;p=0}}
  if(tax==null||!isFinite(tax)){const m=/Stopaj:\s*([\d.,]+)\s*₺/.exec(h.detail||'');tax=m?trN(m[1]):0}tax=+tax||0;
  const net=-(+h.amount||0),rev=h.rev!=null&&isFinite(h.rev)?+h.rev:(q>0?q*p:net+tax),gain=+h.gain||0;
  return{q,p,tax,rev,net,gain,pr:gain+tax}}
// Alım kaydının portföydeki sepeti
function lotOf(f,h){if(h.lot!=null)return f.lots.find(l=>String(l.id)===String(h.lot))||null;
  const a=f.lots.filter(l=>l.date===h.date&&Math.abs((+l.id||0)-(+h.id||0))<=60);if(a.length===1)return a[0];
  const b=f.lots.filter(l=>l.date===h.date&&Math.abs(l.qty*l.cost-h.amount)<.01);return b.length===1?b[0]:null}
// Satışta kullanılan sepet parçaları: yeni kayıtlarda saklı; eskilerde satış öncesi ve sonrası sepetlerin farkından bulunur
function usedOf(f,h){if(Array.isArray(h.used))return h.used;const i=f.hist.indexOf(h);if(i<0||!h.prev)return null;const after=i>0?f.hist[i-1].prev:f.lots;if(!after)return null;
  const u=[];h.prev.forEach(l=>{const a=after.find(x=>String(x.id)===String(l.id)),d=+(l.qty-(a?a.qty:0)).toFixed(6);if(d>1e-6)u.push({id:l.id,date:l.date,qty:d,cost:l.cost})});
  const s=sellInfo(h),tot=u.reduce((a,x)=>a+x.qty,0);return u.length&&(!s.q||Math.abs(tot-s.q)<1e-3)?u:null}
// Aynı fonda bu satıştan sonra yapılmış (silinmemiş) satış var mı?
const laterSell=(f,h)=>f.hist.some(x=>x!==h&&x.type==='sell'&&!x.undone&&(x.date>h.date||(x.date===h.date&&(+x.id||0)>(+h.id||0))));
// Satış tarihinde portföyde olan sepetler (sonradan alınan sepet geçmişteki bir satışta kullanılamaz)
const byDate=(lots,d)=>({ok:lots.filter(l=>l.date<=d),later:lots.filter(l=>l.date>d)});
const sumQ=a=>a.reduce((s,l)=>s+l.qty,0);
// Satışın kendi stopaj oranı (fonun oranı sonradan değiştiyse eski satış eski oranla kalır)
const rateOf=(f,h)=>{const s=sellInfo(h);return s.pr>0.005&&s.tax>=0?Math.round(s.tax/s.pr*1000)/1000:f.tax};
function putBack(lots,used){const o=lots.map(l=>({...l}));used.forEach(u=>{const e=o.find(l=>String(l.id)===String(u.id));if(e)e.qty=+(e.qty+u.qty).toFixed(6);else o.push({id:u.id,date:u.date,qty:u.qty,cost:u.cost})});return o}
const keepOld=h=>{const o={date:h.date,detail:h.detail,amount:h.amount,gain:h.gain,undone:h.undone};['q','p','tax','rev'].forEach(k=>{if(h[k]!=null)o[k]=h[k]});if(h.used)o.used=h.used;return o};
// Bir işlem kaydı düzenlenebilir/silinebilir mi? (neden olmadığı da söylenir)
function txCan(f,h){if(h.undone)return{ok:false,why:'Bu işlem zaten silinmiş.'};if(h.type==='buy'){const l=lotOf(f,h),b=buyInfo(h);if(!l)return{ok:false,why:'Bu alımın sepeti artık portföyde yok (tamamı satılmış ya da silinmiş). Önce ilgili satışı silin.'};
    if(b.q&&Math.abs(l.qty-b.q)>(+h.q>0?1e-6:6e-4))return{ok:false,why:'Bu alımın bir kısmı satılmış. Düzenlemek ya da silmek için önce ilgili satışı silin.'};return{ok:true,lot:l}}
  if(h.type==='sell'){if(laterSell(f,h))return{ok:false,why:'Bu satıştan sonra yapılmış satış var. FIFO sırası bozulmasın diye önce sonraki satışları (en yenisinden başlayarak) silin ya da düzenleyin.'};const u=usedOf(f,h);if(!u)return{ok:false,why:'Bu eski satış kaydında hangi sepetlerin satıldığı bilgisi yok. Yalnızca en son işlemse fonun Geçmiş sekmesinden “Geri al” ile kaldırılabilir.'};return{ok:true,used:u}}
  return{ok:false,why:''}}

/* --- Fiyat hatırlatıcısı: en az 2 iş günü fiyat girilmeyen (ya da kontrol edilmeyen) fon --- */
function staleDays(f){if(!(Q(f)>0))return 0;const L=f.log[f.log.length-1];let b=f.chk||(L&&L.d);if(L&&b&&L.d>b)b=L.d;if(!b)return 0;const t=today();if(b>=t)return 0;
  const days=Math.round((Date.parse(t)-Date.parse(b))/864e5);if(days>30)return days;let wd=0;for(let d=addD(b,1);d<=t;d=addD(d,1)){const w=new Date(d+'T00:00:00Z').getUTCDay();if(w!==0&&w!==6)wd++}return wd>=2?days:0}

/* --- Enflasyon (TÜFE): GitHub her gün TCMB'nin Tüketici Fiyatları sayfasından tufe.json üretir; uygulama onu okur --- */
const TFK='fon-tufe';let TUFE=null;try{TUFE=JSON.parse(localStorage.getItem(TFK)||'null')}catch(e){}
let TIX=null;
function tufeIx(){if(!TUFE||!TUFE.m)return null;if(TIX&&TIX.k===TUFE.son)return TIX;const ms=Object.keys(TUFE.m).filter(k=>/^\d{4}-\d{2}$/.test(k)).sort();if(!ms.length)return null;let v=1;const ix={};ms.forEach(m=>{v*=1+(+TUFE.m[m][1]||0)/100;ix[m]=v});TIX={k:TUFE.son,ms,ix,first:ms[0],last:ms[ms.length-1]};return TIX}
// Bir tarihten son açıklanan aya kadar fiyatlar genel seviyesindeki artış (çarpan); veri yoksa null
function inflFrom(d){const t=tufeIx();if(!t)return null;const m=d.slice(0,7);if(m>=t.last)return 1;if(m<t.first)return null;let k=m;while(!(k in t.ix)&&k<t.last){const [y,mm]=k.split('-').map(Number);k=mm===12?`${y+1}-01`:`${y}-${String(mm+1).padStart(2,'0')}`}return t.ix[t.last]/t.ix[k]}
function realOf(funds){let v=0,c=0,ci=0,miss=0;funds.forEach(f=>f.lots.forEach(l=>{const k=inflFrom(l.date);if(k==null){miss++;return}v+=l.qty*f.price;c+=l.qty*l.cost;ci+=l.qty*l.cost*k}));
  if(!(c>0))return null;return{nom:(v/c-1)*100,inf:(ci/c-1)*100,real:(v/ci-1)*100,v,c,ci,miss}}
function yearInfl(Y){const t=tufeIx();if(!t)return null;let v=1,n=0,lastM=null;for(let m=1;m<=12;m++){const k=`${Y}-${String(m).padStart(2,'0')}`;if(TUFE.m[k]){v*=1+(+TUFE.m[k][1]||0)/100;n++;lastM=k}}return n?{p:(v-1)*100,n,lastM}:null}
const infLbl=i=>i.n===12?'Ocak–Aralık':i.n===1?'Ocak':'Ocak–'+AYLAR[+i.lastM.slice(5)-1];
async function loadTufe(){if(location.protocol==='file:')return;try{const r=await fetch('tufe.json',{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(!j||!j.m||!j.son)return;
  const ch=!TUFE||TUFE.son!==j.son||TUFE.guncelleme!==j.guncelleme;TUFE=j;TIX=null;try{localStorage.setItem(TFK,JSON.stringify(j))}catch(e){}if(ch&&!sheetOpen()&&!sw&&!scr)render()}catch(e){}}

/* --- Değer grafiği --- */
const RNG=[['1H',7],['1A',30],['3A',91],['1Y',365],['all',1e5]],RNGL={'1H':'Son 1 hafta','1A':'Son 1 ay','3A':'Son 3 ay','1Y':'Son 1 yıl',all:'Tüm zamanlar'};
const segsOf=f=>{const s=f.lots.map(l=>({d:l.date,q:l.qty,c:l.cost,e:null}));f.hist.forEach(h=>{if(h.type!=='sell'||h.undone)return;const u=usedOf(f,h);if(u)u.forEach(x=>s.push({d:x.date,q:x.qty,c:x.cost,e:h.date}))});return s};
let serC={k:null,v:[]};
// Portföyün günlük değeri (v), maliyeti (c) ve kümülatif kâr/zararı (pl: değer − maliyet + gerçekleşen satış kârı)
function series(){const key=S.updatedAt+'|'+today()+'|'+S.funds.length;if(serC.k===key)return serC.v;
  const F=S.funds.map(f=>({s:segsOf(f),L:f.log,sl:f.hist.filter(h=>h.type==='sell'&&!h.undone&&usedOf(f,h)).map(h=>({d:h.date,pr:sellInfo(h).pr}))}));
  let st=null;F.forEach(x=>x.s.forEach(g=>{if(!st||g.d<st)st=g.d}));const out=[];
  if(st){const end=today(),ptr=F.map(()=>0);if(st<addD(end,-4000))st=addD(end,-4000);
    for(let d=st;d<=end;d=addD(d,1)){let v=0,c=0,rz=0;F.forEach((x,i)=>{const L=x.L;while(ptr[i]<L.length&&L[ptr[i]].d<=d)ptr[i]++;const p=ptr[i]>0?L[ptr[i]-1].p:null;
      x.s.forEach(g=>{if(g.d<=d&&(!g.e||d<g.e)){v+=g.q*(p??g.c);c+=g.q*g.c}});x.sl.forEach(s=>{if(s.d<=d)rz+=s.pr})});out.push({d,v,c,pl:v-c+rz})}}
  serC={k:key,v:out};return out}
const rngDays=()=>(RNG.find(r=>r[0]===view.rng)||RNG[1])[1];
const CH={};
function chartH(key,pts,o){const segs=segH('rng',RNG.map(([k])=>[k,k==='all'?'Tümü':k]),view.rng);
  if(pts.length<2)return `<section class="chart glass card" data-k="ch-${key}"><div class="chd"><div class="lbl">${o.title}</div><div class="cempty">${o.empty}</div></div>${segs}</section>`;
  const W=1000,H=170,vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),pad=(mx-mn)*.14||Math.abs(mx)*.02||1,lo=mn-pad,hi=mx+pad;
  const t0=Date.parse(pts[0].d),t1=Date.parse(pts[pts.length-1].d),xs=pts.map(p=>t1>t0?(Date.parse(p.d)-t0)/(t1-t0):0),Y=v=>+(H-(v-lo)/(hi-lo)*H).toFixed(1),ys=pts.map(p=>Y(p.v));
  const path=a=>a.map((y,i)=>(i?'L':'M')+(xs[i]*W).toFixed(1)+' '+y).join('');
  const line=path(ys),up=o.up(pts.length-1)>=0,costIn=o.cost&&pts.some(p=>p.c>0&&p.c>=lo&&p.c<=hi);CH[key]={pts,xs,ys,H,o};
  const mk=(o.marks||[]).filter(m=>m.d>=pts[0].d&&m.d<=pts[pts.length-1].d).map(m=>{const x=t1>t0?(Date.parse(m.d)-t0)/(t1-t0):0;return `<i class="mk" style="left:${(x*100).toFixed(2)}%;top:${(Y(m.v)/H*100).toFixed(2)}%"></i>`}).join('');
  const hd=o.head(pts.length-1,false);
  return `<section class="chart glass card ${up?'up':'dn'}" data-k="ch-${key}" data-ck="${key}"><div class="chd"><div class="lbl cdl">${hd.l}</div><div class="cv">${hd.v}</div><div class="cc">${hd.c}</div></div>
  <div class="plot" aria-label="${esc(o.title)} grafiği. Parmağınızı grafik üzerinde gezdirerek tarihlerdeki değeri görebilirsiniz."><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="cg-${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".24"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>
  <path d="${line}L${W} ${H}L0 ${H}Z" fill="url(#cg-${key})" stroke="none"/>${costIn?`<path class="cl" d="${path(pts.map(p=>Y(p.c)))}" fill="none" vector-effect="non-scaling-stroke"/>`:''}<path d="${line}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>${mk}<i class="cx"></i><i class="cdot"></i></div>
  ${costIn?o.legend:o.legend&&!o.cost?o.legend:''}${segs}</section>`}
function portChart(){const all=series(),cut=addD(today(),-rngDays()),pts=all.filter(p=>p.d>=cut);
  // Getiri yüzdesi: kâr/zarar ÷ (dönem başındaki değer + dönem içinde yatırılan para); sonradan eklenen para yüzdeyi şişirmesin
  const inf=[0];for(let i=1;i<pts.length;i++)inf[i]=inf[i-1]+Math.max(0,pts[i].c-pts[i-1].c);
  const full=pts.length&&all.length&&pts[0].d===all[0].d,base=i=>((full?pts[0].c:pts[0].v)+inf[i])||1,g=i=>pts[i].pl-(full?0:pts[0].pl);

    legend:`<div class="clg"><span class="ln"></span>Değer<span class="ln ds"></span>Yatırılan (maliyet)</div>`,

function fundChart(f){const cut=addD(today(),-rngDays()),L=f.log;let pts=L.filter(e=>e.d>=cut).map(e=>({d:e.d,v:e.p}));const pre=L.filter(e=>e.d<cut).pop();if(pre&&(!pts.length||pts[0].d>cut))pts.unshift({d:cut,v:pre.p});
  if(pts.length&&pts[pts.length-1].d<today())pts.push({d:today(),v:pts[pts.length-1].v});

/* --- Isı haritası: kutu büyüklüğü fonun değeri, renk seçilen dönemin getirisi --- */
function tmap(items,x,y,w,h,out){if(!items.length)return;if(items.length===1){out.push({...items[0],x,y,w,h});return}
  const tot=items.reduce((a,b)=>a+b.a,0);let acc=0,k=0;while(k<items.length-1&&acc+items[k].a<=tot/2){acc+=items[k].a;k++}if(k===0){acc=items[0].a;k=1}
  const A=items.slice(0,k),B=items.slice(k),fr=acc/tot;if(w>=h){tmap(A,x,y,w*fr,h,out);tmap(B,x+w*fr,y,w*(1-fr),h,out)}else{tmap(A,x,y,w,h*fr,out);tmap(B,x,y+h*fr,w,h*(1-fr),out)}}
function heatH(){const held=S.funds.filter(f=>V(f)>0);if(!held.length)return'';const per=view.hm||'daily',cap={daily:2,weekly:5,total:25}[per];
  const it=held.map(f=>({f,a:V(f),r:ret(f,per)})).sort((a,b)=>b.a-a.a),out=[];tmap(it,0,0,360,210,out);
  return `<div class="sech"><h2>Isı haritası</h2><span>büyüklük: değer · renk: getiri</span></div>
  <section class="glass card heatc" data-k="heat"><div class="heat">${out.map(t=>{const p=t.r.p,k=Math.min(1,Math.abs(p)/cap),a=(.18+.72*k).toFixed(2),sm=t.w<70||t.h<46;
    return `<button class="tile ${p>0.0001?'up':p<-0.0001?'dn':'eq'}${k>.4?' st':''}" data-act="open" data-id="${esc(t.f.code)}" style="left:${(t.x/3.6).toFixed(3)}%;top:${(t.y/2.1).toFixed(3)}%;width:${(t.w/3.6).toFixed(3)}%;height:${(t.h/2.1).toFixed(3)}%;--a:${a}"><b>${esc(t.f.code)}</b>${sm?'':`<span>${pc(p)}</span>`}</button>`}).join('')}</div>
  ${segH('hm',[['daily','Günlük'],['weekly','Haftalık'],['total','Toplam']],per)}</section>`}

const LKK='fon-kilit';let lockId=null;try{lockId=localStorage.getItem(LKK)}catch(e){}
const b64e=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
let canLock=false,locked=false,hidAt=0,lockFails=0;
(async()=>{try{canLock=!!(window.PublicKeyCredential&&navigator.credentials&&isSecureContext&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){canLock=false}if(view.page==='settings'&&!sheetOpen())render()})();
async function lockOn(){try{const c=await navigator.credentials.create({publicKey:{rp:{name:'Fon Portföyüm'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'portfoy',displayName:'Fon Portföyüm'},
    challenge:crypto.getRandomValues(new Uint8Array(32)),pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,attestation:'none'}});
  if(!c)throw 0;const id=b64e(c.rawId);localStorage.setItem(LKK,id);lockId=id;toast('Face ID kilidi açıldı.');render()}catch(e){toast(e&&e.name==='NotAllowedError'?'Face ID kurulumu iptal edildi.':'Face ID kilidi kurulamadı.')}}
async function verify(){const r=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:b64d(lockId),transports:['internal','hybrid']}],userVerification:'required',timeout:60000}});if(!r)throw 0;return true}
function lockClear(){lockId=null;try{localStorage.removeItem(LKK)}catch(e){}render();toast('Face ID kilidi kapatıldı.')}
// Kapatmak için Face ID istenir; geçiş anahtarı silinmişse (uygulama zaten açık olduğundan) onayla kapatılabilir
async function lockOff(){try{await verify();lockClear()}catch(e){modal(`<h3>Face ID doğrulanamadı</h3><p class="sub" style="white-space:normal">Doğrulamayı iptal ettiyseniz tekrar deneyebilirsiniz. Geçiş anahtarı iPhone’un Parolalar uygulamasından silindiyse kilidi buradan kapatabilirsiniz; verileriniz silinmez.</p><div class="btns"><button class="btn plain" data-act="close">Vazgeç</button><button class="btn red" data-act="lockoffok">Kilidi kapat</button></div>`)}}

/* --- Toplu fiyat girişi ve TEFAS'tan kopyalanan metni okuma --- */
const DRE=/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/,PRE=/^\d{1,3}(\.\d{3})+,\d+$|^\d+,\d+$|^\d+\.\d{4,}$/;
// Metindeki her bilinen fon kodundan sonra gelen ilk ondalıklı sayı fiyattır; kodun hemen önündeki tarih (TEFAS tablosu) o fiyatın tarihidir
function parsePaste(txt,codes){const toks=String(txt).split(/[\s;|]+/).map(t=>t.trim().replace(/^[("']+|[)"':]+$/g,'')).filter(Boolean),out=[];
  const up=t=>t.toLocaleUpperCase('tr-TR').replace(/İ/g,'I');
  for(let i=0;i<toks.length;i++){const c=up(toks[i]);if(!codes.has(c))continue;
    let d=null;const m=i>0&&DRE.exec(toks[i-1]);if(m)d=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    for(let j=i+1;j<Math.min(toks.length,i+60);j++){const t=toks[j],u=up(t);if(codes.has(u)&&u!==c)break;if(DRE.test(t))continue;if(PRE.test(t)){const p=pn(t);if(p>0)out.push({code:c,d:d&&isDate(d)&&d<=today()?d:null,p});break}}}
  return out}

  <p class="hint" style="margin:8px 4px 12px">Boş bıraktığınız fonlar değişmez. Fiyatı değişmemiş bir fonu “kontrol edildi” saymak için aynı fiyatı yazabilirsiniz.</p>
  <div class="glass card pad paste"><div class="lbl" style="font-weight:600;color:var(--ink)">TEFAS’tan yapıştır</div><div class="hint" style="margin:0">TEFAS’ta fonun sayfasını ya da “Tarihsel Veriler” tablosunu açın, fon kodu ve fiyatın olduğu kısmı seçip kopyalayın, buraya yapıştırın. Uygulama portföyünüzdeki fon kodlarını ve fiyatlarını kendisi bulur.</div>

function bulkParse(){const codes=new Set(S.funds.map(f=>f.code)),res=parsePaste(g('bp_t'),codes),el=$('#bp_r');bulkX=[];

  const by={};res.forEach(r=>{(by[r.code]=by[r.code]||[]).push(r)});const rows=[];
  const skip=[];S.funds.forEach((f,i)=>{const a=by[f.code];if(!a)return;const dd=a.filter(x=>x.d).sort((x,y)=>x.d<y.d?-1:1),last=dd.length?dd[dd.length-1]:a[a.length-1];

    rows.push(f.code+(dd.length>1?` (${dd.length} gün)`:''))});

  const ch=[];let bad=false;S.funds.forEach((f,i)=>{const inp=$('#bp_'+i);if(!inp||!inp.value.trim())return;const p=pn(inp.value);if(!(p>0)){bad=true;inp.classList.add('bad');return}ch.push({f,d:inp.dataset.d||d0,p})});

function txEdit(id){const x=findTx(id);if(!x)return;const {f,h}=x,s=h.type==='sell',info=s?sellInfo(h):buyInfo(h),cn=txCan(f,h);if(!cn.ok)return;
  const base0=s?putBack(f.lots,cn.used):null,rt=s?rateOf(f,h):0,avOn=d=>sumQ(byDate(base0,d).ok),avail=s?avOn(h.date):0;
  modal(`<h3>${s?'Satışı':'Alımı'} düzenle · ${esc(f.code)}</h3>
  <div class="f"><div class="lh"><label for="x_d">İşlem tarihi</label></div><input id="x_d" type="date" max="${today()}" value="${h.date}"></div>
  <div class="two">${fld('x_q','Adet',info.q?dec(+info.q.toFixed(6)):'',s?`<span class="sub" id="x_av" style="font-size:12px">en çok ${num(avail)}</span>`:'')}${fld('x_p','Birim fiyat (₺)',info.p?dec(info.p):'')}</div>
  <div id="x_pv"></div><p class="err" id="x_e"></p>
  <div class="btns"><button class="btn plain" data-act="close">Vazgeç</button><button class="btn pri" data-act="txeditok" data-id="${esc(id)}">Kaydet</button></div>`);
  if(s){const upd=()=>{const q=pn(g('x_q')),p=pn(g('x_p')),d=isDate(g('x_d'))?g('x_d'):h.date,av=avOn(d),el=$('#x_pv');$('#x_av').textContent='en çok '+num(av);if(!(q>0&&p>0)||q>av+1e-4){el.innerHTML='';return}const r=sellRun(byDate(base0,d).ok,q,p,rt).r;
    el.innerHTML=`<div class="pv"><div><span>FIFO kâr / zarar</span><b class="${r.pr>=0?'up':'dn'}">${sgn(r.pr)}</b></div><div><span>Stopaj (${rateTxt(rt)}, satıştaki oran)</span><b class="dn">−${money(r.tax)}</b></div><div class="tot"><span>Net ele geçen</span><b>${money(r.net)}</b></div></div>`};$('#m').oninput=upd;upd()}}
function txEditOk(id){const x=findTx(id);if(!x)return;const {f,h}=x,s=h.type==='sell',cn=txCan(f,h),e=$('#x_e');if(!cn.ok){e.textContent=cn.why;return}
  const q=pn(g('x_q')),p=pn(g('x_p')),d=g('x_d');if(!(q>0&&p>0)){e.textContent='Geçerli bir adet ve birim fiyat girin.';return}if(!isDate(d)||d>today()){e.textContent='İleri tarihli işlem girilemez.';return}
  const old=keepOld(h);
  if(!s&&d<h.date&&f.hist.some(x=>x.type==='sell'&&!x.undone&&x.date>=d&&x.date<h.date)){e.textContent='Bu alım, arada yapılmış bir satıştan önceye alınamaz (FIFO sırası bozulur). Önce o satışı silin.';return}
  if(!s){const nl=f.lots.map(l=>l===cn.lot?{...l,date:d,qty:q,cost:p}:l);commit(f,'edit',today(),`${dTR(old.date)} tarihli alım düzenlendi → ${dTR(d)}, ${num(q)} adet × ${num(p,6)} ₺.`,0,nl,0,{ref:h.id,old});
    Object.assign(h,{date:d,q,p,amount:q*p,detail:buyTxt(q,p),lot:cn.lot.id})}
  else{const bd=byDate(putBack(f.lots,cn.used),d),avail=sumQ(bd.ok);if(q>avail+1e-4){e.textContent=`${dTR(d)} tarihinde en çok ${num(avail)} adet satılabilir.`;return}
    const r=sellRun(bd.ok,q,p,rateOf(f,h));commit(f,'edit',today(),`${dTR(old.date)} tarihli satış düzenlendi → ${dTR(d)}, ${num(q)} adet × ${num(p,6)} ₺.`,0,[...r.lots,...bd.later],0,{ref:h.id,old});
    Object.assign(h,{date:d,q,p,used:r.used,tax:r.r.tax,rev:r.r.rev,gain:r.r.pr-r.r.tax,amount:-r.r.net,detail:sellTxt(q,p,r.r)})}
  closeM();save();toast('İşlem düzenlendi. Fonun Geçmiş sekmesinden geri alabilirsiniz.')}
function txDel(id){const x=findTx(id);if(!x)return;const {f,h}=x,s=h.type==='sell';
  modal(`<h3>${s?'Satış':'Alım'} silinsin mi?</h3><p>${esc(f.code)} · ${dTR(h.date)} · ${esc(dtl(h.detail))}</p><p class="sub" style="white-space:normal">${s?'Satılan adetler portföye geri konur, bu satışın kâr/zararı ve stopajı hesaplardan çıkar.':'Bu alımın sepeti portföyden çıkarılır.'} Fonun Geçmiş sekmesinden geri alabilirsiniz.</p>

function txDelOk(id){const x=findTx(id);if(!x)return;const {f,h}=x,s=h.type==='sell',cn=txCan(f,h);if(!cn.ok){toast(cn.why);closeM();return}const old=keepOld(h);
  if(!s){const b=buyInfo(h);commit(f,'delete',today(),`${dTR(h.date)} tarihli alım silindi (${num(b.q||cn.lot.qty)} adet).`,-h.amount,f.lots.filter(l=>l!==cn.lot),0,{ref:h.id,old})}
  else{const i=sellInfo(h);commit(f,'delete',today(),`${dTR(h.date)} tarihli satış silindi; ${num(i.q)} adet portföye geri kondu.`,0,putBack(f.lots,cn.used),0,{ref:h.id,old})}
  h.undone=true;closeM();save();toast('İşlem silindi.')}

/* --- Yıllık özet --- */
function yearsList(){const ys=new Set([today().slice(0,4)]);S.funds.forEach(f=>{f.hist.forEach(h=>{if((h.type==='buy'||h.type==='sell')&&!h.undone)ys.add(h.date.slice(0,4))})});return [...ys].sort().reverse()}
function yearData(Y){const ys=Y+'-01-01',ye=Y+'-12-31',rows=[];let tb=0,tr=0,tt=0,tg=0,nb=0,ns=0;
  S.funds.forEach(f=>{let b=0,r=0,t=0,gn=0,k=0;f.hist.forEach(h=>{if(h.undone||h.date<ys||h.date>ye)return;if(h.type==='buy'){b+=h.amount;nb++;k++}else if(h.type==='sell'){const s=sellInfo(h);r+=s.rev;t+=s.tax;gn+=s.gain;ns++;k++}});
    let a=null,z=null;for(const e of f.log){if(e.d<ys)a=e;else if(e.d<=ye){if(!a)a=e;z=e}}if(!z&&a&&a.d<ys)z=null;
    const perf=a&&z&&a!==z?{p:(z.p/a.p-1)*100,from:a.d<ys?null:a.d,to:z.d}:null;
    if(k||perf)rows.push({f,b,r,t,gn,perf});tb+=b;tr+=r;tt+=t;tg+=gn});
  return{rows,tb,tr,tt,tg,nb,ns}}
function yearPage(){const yl=yearsList();if(!yl.includes(view.yr))view.yr=yl[0];const Y=view.yr,D=yearData(Y),inf=yearInfl(Y);

  return `${dnav('Özet',`<button class="cap glass" data-act="yrcopy"><span>Kopyala</span></button>`)}<header class="hdr"><div><h1>Yıllık özet</h1></div></header>
  ${chipsH('yr',yl.map(y=>[y,y]),Y)}
  <section class="hero glass"><div class="lbl" style="position:relative">${Y} yılında gerçekleşen kâr/zarar (stopaj sonrası)</div><div class="big md ${D.tg>=0?'up':'dn'}">${T('y-g',D.tg,'sgn')}</div>
  <div class="pv" style="position:relative"><div><span>Satış sayısı</span><b>${D.ns}</b></div><div><span>Satışların brüt tutarı</span><b>${money(D.tr)}</b></div><div><span>Kesilen stopaj</span><b class="dn">−${money(D.tt)}</b></div><div><span>Stopaj öncesi kâr/zarar</span><b class="${D.tg+D.tt>=0?'up':'dn'}">${sgn(D.tg+D.tt)}</b></div><div class="tot"><span>${D.nb} alım · yatırılan</span><b>${money(D.tb)}</b></div></div></section>
  ${inf?`<div class="list glass"><div class="row"><div class="l"><b>${Y} enflasyonu (TÜFE)</b><div class="sub">${infLbl(inf)} · TCMB</div></div><b>${pc(inf.p)}</b></div></div>`:''}
  ${best?`<div class="sech"><h2>En iyi ve en kötü fon</h2><span>fiyat performansı</span></div><div class="list glass"><div class="row">${pr(best)}</div>${worst&&worst!==best?`<div class="row">${pr(worst)}</div>`:''}</div>`:''}
  <div class="sech"><h2>Fon bazında</h2><span>${Y}</span></div>
  <div class="list glass">${D.rows.map(r=>`<button class="row" data-act="open" data-id="${esc(r.f.code)}">${av(r.f)}<div class="l"><b>${esc(r.f.code)}</b><div class="sub wrap">Alım ${money(r.b)} · Stopaj ${money(r.t)}${r.perf?' · Fiyat '+pc(r.perf.p):''}</div></div><div class="r"><b class="${r.gn>=0?'up':'dn'}">${sgn(r.gn)}</b><div class="d sub">gerçekleşen</div></div></button>`).join('')||'<div class="empty">Bu yıl için işlem ya da fiyat kaydı yok.</div>'}</div>
  <p class="hint" style="text-align:center;margin:2px 8px">Kendi hesabınız içindir; vergi beyanında aracı kurumunuzun dökümünü esas alın. Fiyat performansı, girdiğiniz fiyatlara göre yıl başından (ya da ilk fiyattan) yıl sonuna (ya da son fiyata) hesaplanır.</p>`}
function yearText(){const Y=view.yr,D=yearData(Y),inf=yearInfl(Y),L=[`Fon Portföyüm · ${Y} yıllık özet`,`Gerçekleşen kâr/zarar (stopaj sonrası): ${sgnR(D.tg)}`,`Stopaj öncesi kâr/zarar: ${sgnR(D.tg+D.tt)}`,`Kesilen stopaj: ${moneyR(D.tt)}`,`Satışların brüt tutarı: ${moneyR(D.tr)} (${D.ns} satış)`,`Yatırılan: ${moneyR(D.tb)} (${D.nb} alım)`];

    case 'brestok':if(pend){S=pend;pend=null;closeM();save(false);if(view.page==='home')render();else go('home');toast('Yedek geri yüklendi.')}break;

  else{a.style.transition='transform .4s var(--spring),opacity .4s';a.style.transform='';a.style.opacity='';setTimeout(()=>{a.style.transition=''},420)}};

/* Sekme çubuğu: parmakla sürükleyerek seçim (bırakınca en yakın sekmeye geçer); dokunma da çalışır */
/* iPhone'da dokunma olayları (touch) kullanılır: iOS'ta en güvenilir yol budur; fare için pointer olayları */
(()=>{const nav=document.getElementById('nav');let d=null,blockClick=false;
  const parts=()=>{const th=nav.querySelector('.thumb'),b=[...nav.querySelectorAll('button')];return{th,b}};
  const place=(th,x,w)=>{th.style.width=w+'px';th.style.transform=`translateX(${x}px)`};
  const start=(cx,cy)=>{d={x0:cx,y0:cy,moved:false,x:0,w:0,t:null}};
  const move=cx=>{if(!d)return false;const{th,b}=parts();if(!th||!b.length)return false;
    if(!d.moved){if(Math.abs(cx-d.x0)<6)return false;d.moved=true;nav.classList.add('drag');th._hold=true;th.classList.add('sw');clearTimeout(th._t)}
    const r=nav.getBoundingClientRect(),w=b[0].offsetWidth,lo=b[0].offsetLeft,hi=b[b.length-1].offsetLeft;
    const x=Math.max(lo-10,Math.min(hi+10,cx-r.left-w/2));d.x=Math.max(lo,Math.min(hi,x));d.w=w;place(th,x,w);
    let best=b[0],bd=1e9;b.forEach(k=>{const dd=Math.abs(k.offsetLeft+k.offsetWidth/2-(x+w/2));if(dd<bd){bd=dd;best=k}});
    if(d.t!==best.dataset.id&&navigator.vibrate)try{navigator.vibrate(4)}catch(_){}
    d.t=best.dataset.id;b.forEach(k=>k.classList.toggle('pre',k===best));return true};
  const end=cancel=>{if(!d)return;const m=d.moved,t=d.t,x=d.x,w=d.w;d=null;if(!m)return;
    blockClick=true;setTimeout(()=>blockClick=false,400);nav.classList.remove('drag');
    const{th,b}=parts();b.forEach(k=>k.classList.remove('pre'));th._hold=false;lens(th,360);
    const cur=nav.querySelector('button.on');
    if(!cancel&&t&&cur&&t!==cur.dataset.id){SEGX.nav={x,w};go(t)}
    else if(cur)place(th,cur.offsetLeft,cur.offsetWidth)};
  nav.addEventListener('touchstart',e=>{if(e.touches.length!==1){d=null;return}const t=e.touches[0];start(t.clientX,t.clientY)},{passive:true});
  nav.addEventListener('touchmove',e=>{if(!d)return;const t=e.touches[0];if(move(t.clientX)&&e.cancelable)e.preventDefault()},{passive:false});
  /* Dokunma: parmak kalkınca altındaki sekmeye doğrudan geçilir (click beklenmez; iOS hızlı dokunuşları yutmaz) */
  const hit=cx=>parts().b.find(k=>{const r=k.getBoundingClientRect();return cx>=r.left&&cx<=r.right});
  nav.addEventListener('touchend',e=>{if(!d)return;if(d.moved){end(false);return}d=null;const t=e.changedTouches[0],k=t&&hit(t.clientX);if(!k)return;
    if(e.cancelable)e.preventDefault();blockClick=true;setTimeout(()=>blockClick=false,400);go(k.dataset.id)},{passive:false});
  /* iOS sürüklemeyi bazen iptal eder: parmak bir sekmeye taşındıysa yine de o sekmeye geç */
  nav.addEventListener('touchcancel',()=>end(false),{passive:true});
  nav.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.button>0)return;start(e.clientX,e.clientY)});
  addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;move(e.clientX)});
  addEventListener('pointerup',e=>{if(e.pointerType==='touch')return;end(false)});
  nav.addEventListener('click',e=>{if(blockClick){e.stopPropagation();e.preventDefault()}},true);
})();
/* Segment seçiciler (Sepetler/Nakit hesabı/Geçmiş, tema, dönem, grafik aralığı…): sekme çubuğundaki gibi parmakla
   sürüklenince mercek parmağı izler, bırakınca en yakın seçeneğe geçer. Segmentler her çizimde yeniden oluştuğu için
   başlangıç belgeden dinlenir, yeni segmentlere de dinleyici otomatik bağlanır. Dikey başlayan hareket sayfa kaydırmasıdır, ona karışılmaz. */
(()=>{let d=null,blockUntil=0;
  const parts=s=>({th:s.querySelector(':scope>.thumb'),b:[...s.querySelectorAll(':scope>button')]});
  const place=(th,x,w)=>{th.style.width=w+'px';th.style.transform=`translateX(${x}px)`};
  const start=(s,cx,cy)=>{d={s,x0:cx,y0:cy,cx,cy,moved:false,x:0,w:0,t:null}};
  const move=(cx,cy)=>{if(!d)return false;const s=d.s,{th,b}=parts(s);if(!s.isConnected||!th||!b.length){d=null;return false}
    d.cx=cx;d.cy=cy;
    if(!d.moved){const dx=Math.abs(cx-d.x0),dy=Math.abs(cy-d.y0);if(dy>8&&dy>dx){d=null;return false}if(dx<6)return false;
      d.moved=true;s.classList.add('drag');th._hold=true;th.classList.add('sw');clearTimeout(th._t)}
    const r=s.getBoundingClientRect(),c=cx-r.left;
    let best=b[0],bd=1e9;b.forEach(k=>{const dd=Math.abs(k.offsetLeft+k.offsetWidth/2-c);if(dd<bd){bd=dd;best=k}});
    const w=best.offsetWidth,lo=b[0].offsetLeft,hi=b[b.length-1].offsetLeft+b[b.length-1].offsetWidth-w;
    const x=Math.max(lo-8,Math.min(hi+8,c-w/2));d.x=x;d.w=w;place(th,x,w);
    if(d.t!==best.dataset.id&&d.t!==null&&navigator.vibrate)try{navigator.vibrate(4)}catch(_){}
    d.t=best.dataset.id;b.forEach(k=>k.classList.toggle('pre',k===best));return true};
  const end=()=>{if(!d)return false;const{s,moved,t,x,w,cx,cy}=d;d=null;if(!moved)return false;
    blockUntil=performance.now()+400;s.classList.remove('drag');
    const{th,b}=parts(s);b.forEach(k=>k.classList.remove('pre'));if(th){th._hold=false;lens(th,360)}
    const cur=s.querySelector(':scope>button.on'),tb=b.find(k=>k.dataset.id===t);
    if(tb&&tb!==cur&&s.isConnected){SEGX[s.id||s.dataset.seg]={x,w};lastXY={x:cx,y:cy};act(tb.dataset.act,tb.dataset.id)}
    else if(cur&&th)place(th,cur.offsetLeft,cur.offsetWidth);
    return true};
  document.addEventListener('touchstart',e=>{const s=e.target.closest('.seg');
    /* Alt sayfada ekranın sol kenarından başlayan hareket "geri" kaydırmasıdır */
    if(!s||e.touches.length!==1||(PARENT[view.page]&&e.touches[0].clientX<28)){d=null;return}start(s,e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  /* Engelleyen (passive:false) dinleyiciler yalnızca segmentlere bağlanır; sayfanın geri kalanında kaydırma JS'i beklemez */
  const tm=e=>{if(!d)return;const t=e.touches[0];if(t&&move(t.clientX,t.clientY)&&e.cancelable)e.preventDefault()};
  const te=e=>{if(end()&&e.cancelable)e.preventDefault()};
  const bind=()=>document.querySelectorAll('.seg').forEach(s=>{if(s._dg)return;s._dg=1;s.addEventListener('touchmove',tm,{passive:false});s.addEventListener('touchend',te,{passive:false})});
  bind();new MutationObserver(bind).observe(document.getElementById('app'),{childList:true,subtree:true});
  /* iOS sürüklemeyi bazen iptal eder: parmak başka seçeneğe taşındıysa yine de ona geçilir */
  document.addEventListener('touchcancel',()=>end(),{passive:true});
  document.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.button>0)return;const s=e.target.closest('.seg');if(s)start(s,e.clientX,e.clientY)});
  addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;move(e.clientX,e.clientY)});
  addEventListener('pointerup',e=>{if(e.pointerType==='touch')return;end()});
  document.addEventListener('click',e=>{if(performance.now()<blockUntil&&e.target.closest('.seg')){e.stopPropagation();e.preventDefault()}},true);
})();
/* Mercek hareket ederken altından geçen simge/yazı büyür ve renk kırılması alır */
(()=>{let raf=0;const tick=()=>{raf=0;let any=false;
  document.querySelectorAll('.seg>.thumb,.tabbar>.thumb').forEach(th=>{const on=th.classList.contains('sw');const r=th.getBoundingClientRect();
    th.parentElement.querySelectorAll(':scope>button').forEach(b=>{let u=false;if(on){const q=b.getBoundingClientRect(),c=q.left+q.width/2;u=c>r.left+6&&c<r.right-6}b.classList.toggle('under',u)});if(on)any=true});
  if(any)raf=requestAnimationFrame(tick)};
  new MutationObserver(()=>{if(!raf)raf=requestAnimationFrame(tick)}).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class','style']});
})();
/* Gösterge cam mercek modu: ms>0 → o süre sonra koyu kapsüle döner; ms=0 → parmak kalkana kadar */
function lens(th,ms){if(!th||RM())return;th.classList.add('sw');clearTimeout(th._t);th._hold=!ms;th._t=setTimeout(()=>{if(!ms)th._hold=false;if(!th._hold)th.classList.remove('sw')},ms||2500)}
/* Basılı tutunca da gösterge cam merceğe dönüşür (bırakınca kayıp oturur) */
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.seg button,.tabbar button');if(!b)return;const th=b.parentElement.querySelector(':scope>.thumb');if(th)lens(th,0)},{passive:true});
['pointerup','pointercancel','touchend','touchcancel'].forEach(ev=>document.addEventListener(ev,()=>document.querySelectorAll('.seg>.thumb.sw,.tabbar>.thumb.sw').forEach(th=>{if(th._hold){th._hold=false;lens(th,320)}}),{passive:true}));
/* Ana ekran uygulaması: sekme çubuğunu her sayfada aynı yükseklikte tut */
function placeNav(){const st=navigator.standalone||matchMedia('(display-mode: standalone)').matches;root.classList.toggle('pwa',!!st);if(!st)return;
  const land=innerWidth>innerHeight,H=land?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);
  root.style.setProperty('--scrH',H+'px');const n=document.getElementById('nav');if(n&&n.offsetHeight)root.style.setProperty('--tbH',n.offsetHeight+'px')}
placeNav();addEventListener('resize',placeNav);addEventListener('orientationchange',()=>setTimeout(placeNav,300));addEventListener('pageshow',placeNav);
