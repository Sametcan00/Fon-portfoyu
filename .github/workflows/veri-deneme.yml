# Geçici deneme: TEFAS ve TCMB/TÜİK verilerine GitHub sunucularından erişilebiliyor mu?
# Yalnızca çalışma dalında çalışır; yayındaki uygulamaya dokunmaz. Deneme bitince silinecek.
name: veri-deneme
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/veri-deneme.yml']
jobs:
  dene:
    runs-on: ubuntu-latest
    steps:
      - name: TEFAS ana sayfa
        run: |
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          for u in https://www.tefas.gov.tr/tr https://www.tefas.gov.tr/ https://www.tefas.gov.tr/TarihselVeriler.aspx https://www.tefas.gov.tr/FonAnaliz.aspx?FonKod=TTE; do
            echo "=== $u"; curl -sS -L -m 30 -A "$UA" -o /tmp/p.html -w "kod=%{http_code} boyut=%{size_download} son=%{url_effective}\n" "$u" || true
            head -c 600 /tmp/p.html | tr '\n' ' '; echo
            grep -oE '(src|href|action)="[^"]*(api|\.js|aspx)[^"]*"' /tmp/p.html | sort -u | head -40 || true
            grep -oE '["'"'"'](/api/[^"'"'"']+)' /tmp/p.html | sort -u | head -40 || true
          done
      - name: TEFAS eski API (BindHistoryInfo)
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          B=$(date -d '-7 day' +%d.%m.%Y); E=$(date +%d.%m.%Y)
          curl -sS -m 40 -c /tmp/c.txt -A "$UA" -o /dev/null https://www.tefas.gov.tr/TarihselVeriler.aspx || true
          for k in TTE ""; do
            echo "=== fonkod='$k' $B-$E"
            curl -sS -m 60 -b /tmp/c.txt -A "$UA" -X POST https://www.tefas.gov.tr/api/DB/BindHistoryInfo \
              -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' -H 'X-Requested-With: XMLHttpRequest' \
              -H 'Origin: https://www.tefas.gov.tr' -H 'Referer: https://www.tefas.gov.tr/TarihselVeriler.aspx' \
              --data "fontip=YAT&sfontur=&fonkod=$k&fongrup=&bastarih=$B&bittarih=$E&fonturkod=&fonunvantip=" \
              -o /tmp/r.json -w "kod=%{http_code} boyut=%{size_download}\n" || true
            head -c 900 /tmp/r.json; echo
          done
      - name: TCMB TÜFE sayfası
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          u='https://www.tcmb.gov.tr/wps/wcm/connect/TR/TCMB+TR/Main+Menu/Istatistikler/Enflasyon+Verileri/Tuketici+Fiyatlari'
          curl -sS -L -m 40 -A "$UA" -o /tmp/t.html -w "kod=%{http_code} boyut=%{size_download}\n" "$u" || true
          grep -c '<tr' /tmp/t.html || true
          sed -e 's/<[^>]*>/ /g' /tmp/t.html | tr -s ' \t\r\n' ' ' | grep -oE '[0-9]{2}-[0-9]{4}[^A-Za-z]{0,80}' | head -30 || true
      - name: TÜİK
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          for u in https://www.tuik.gov.tr https://data.tuik.gov.tr; do
            echo "=== $u"; curl -sS -L -m 40 -A "$UA" -o /tmp/u.html -w "kod=%{http_code} boyut=%{size_download} son=%{url_effective}\n" "$u" || true
            head -c 300 /tmp/u.html | tr '\n' ' '; echo
          done
